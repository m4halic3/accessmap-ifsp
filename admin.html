<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>Admin - Locais - AccessMap</title>
    <link rel="icon" type="image/png" href="assets/images/logo-roxa.png">
</head>
<body data-admin="sempre">
    <nav class="navbar" aria-label="Navegação Principal">
        <a href="index.html" class="logo">
            <img src="assets/images/logo-branca.png" alt="Logotipo do AccessMap" class="logo-img">
            <span class="logo-text">ACCESSMAP</span>
        </a>
        <div class="nav-right desktop-only" style="margin-left:auto;">
            <a href="dashboard.html" class="nav-admin-link">
                <i class="fas fa-inbox" aria-hidden="true"></i> Respostas do formulário
            </a>
        </div>
    </nav>

    <main class="container-mapa" id="container-mapa-conteudo" style="position: relative;">
        <div class="sidebar">
            <h2>Resultados (geral)</h2>

            <div class="search-container">
                <label for="search-input" class="sr-only">Pesquisar local no campus</label>
                <i class="fas fa-search search-icon" aria-hidden="true"></i>
                <input type="text" id="search-input" placeholder="Pesquisar local... (Enter para ir)" onkeydown="handleBuscaKeydown(event)">
            </div>

            <div class="fieldset-reset" style="margin-bottom: 20px;" role="region" aria-label="Controles de filtragem por pavimentos">
                <span id="titulo-filtro-ala" style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 8px; color: #000;">Filtrar por Ala</span>
                <div class="type-buttons" id="seletor-alas" style="display: flex; gap: 8px; margin-bottom: 10px;" role="group" aria-labelledby="titulo-filtro-ala">
                    <button type="button" class="btn-type active" aria-current="true" onclick="filtrarAla('todos', this)" style="flex: 1; padding: 8px; cursor: pointer; font-weight: 700; font-size: 0.75rem; border: 2px solid #f0f0f0; border-radius: 8px;">Mapa Geral</button>
                    <button type="button" class="btn-type" aria-current="false" onclick="filtrarAla('edificacoes', this)" style="flex: 1; padding: 8px; cursor: pointer; font-weight: 700; font-size: 0.75rem; border: 2px solid #f0f0f0; border-radius: 8px;">Subsolo Edif.</button>
                    <button type="button" class="btn-type" aria-current="false" onclick="filtrarAla('mecanica', this)" style="flex: 1; padding: 8px; cursor: pointer; font-weight: 700; font-size: 0.75rem; border: 2px solid #f0f0f0; border-radius: 8px;">Subsolo Mec.</button>
                </div>

                <button type="button" class="btn-limpar-mapa" onclick="resetarMapaCompleto()" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:15px;background-color:#007750;color:#ffffff;padding:10px 16px;border:none;border-radius:8px;font-family:system-ui,-apple-system,sans-serif;font-weight:700;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;">
                    <i class="fas fa-eraser" aria-hidden="true"></i> Limpar Mapa e Filtros
                </button>
            </div>

            <div class="header-filtros">
                <h3>Filtrar por Acessibilidade</h3>
                <button class="btn-reset" onclick="mostrarTodos()">Ver Todos</button>
            </div>

            <div class="filtros" role="group" aria-label="Filtros de categorias de acessibilidade">
                <div class="filtro" id="filtro-fisica" onclick="filtrar('fisica', this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); filtrar('fisica', this);}" role="button" tabindex="0" aria-label="Filtrar por Acessibilidade Física" aria-pressed="false">
                    <img src="assets/images/simbolo-fisica.png" alt="Símbolo Internacional de Acessibilidade retratando uma pessoa em cadeira de rodas em verde">
                </div>
                <div class="filtro" id="filtro-auditiva" onclick="filtrar('auditiva', this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); filtrar('auditiva', this);}" role="button" tabindex="0" aria-label="Filtrar por Acessibilidade Auditiva" aria-pressed="false">
                    <img src="assets/images/simbolo-auditiva.png" alt="Símbolo Internacional de Deficiência Auditiva retratando um ouvido atravessado por uma linha em roxo">
                </div>
            </div>

            <button type="button" id="btn-novo-local" class="btn-novo-local">
                <i class="fas fa-plus" aria-hidden="true"></i> Adicionar novo local
            </button>

            <div id="lista-lugares-admin" role="region" aria-label="Lista de locais cadastrados"></div>
        </div>

        <div id="map" aria-label="Mapa interativo do campus (modo admin)"></div>

        <!-- Painel "Inserir / Atualizar Local" -->
        <div id="overlay-form" class="overlay-form oculto">
            <div class="form-local-card">
                <div class="form-local-header">
                    <i class="fas fa-map-pin" aria-hidden="true"></i>
                    <span id="form-titulo">Inserir / Atualizar Local</span>
                    <button type="button" id="btn-fechar-form" class="btn-fechar-form" aria-label="Fechar formulário">&times;</button>
                </div>
                <div class="form-local-body">
                    <label for="form-nome">Nome do local</label>
                    <input type="text" id="form-nome" placeholder="Ex: Bloco A - Biblioteca">

                    <label for="form-coords">Coordenadas (X, Y - Leaflet)</label>
                    <div class="coord-row">
                        <span id="form-coords">X: —, Y: —</span>
                        <button type="button" id="btn-auto-coords" class="btn-auto-coords">Auto</button>
                    </div>
                    <p class="dica-coords">Clique em qualquer ponto do mapa pra marcar a posição, depois clique em "Auto".</p>

                    <label for="form-bloco">Bloco / Setor</label>
                    <select id="form-bloco"></select>

                    <label>Atributos</label>
                    <div class="atributos-row">
                        <label><input type="checkbox" id="form-acessivel"> Acessível</label>
                        <label><input type="checkbox" id="form-alerta"> Alerta</label>
                    </div>

                    <div class="form-local-actions">
                        <button type="button" id="btn-excluir-local" class="btn-excluir oculto">Excluir</button>
                        <button type="button" id="btn-salvar-local" class="btn-salvar">Salvar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal de confirmação (adicionar / atualizar / excluir) -->
        <div id="overlay-confirmacao" class="overlay-form oculto" aria-hidden="true">
            <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-titulo" aria-describedby="confirm-texto">
                <div class="confirm-icon" aria-hidden="true">
                    <i class="fas fa-triangle-exclamation"></i>
                </div>
                <h2 id="confirm-titulo">Confirmar ação</h2>
                <p id="confirm-texto">Tem certeza?</p>
                <div class="confirm-actions">
                    <button type="button" id="btn-confirmar-cancelar" class="btn-confirm-cancelar">Cancelar</button>
                    <button type="button" id="btn-confirmar-ok" class="btn-confirm-ok">Confirmar</button>
                </div>
            </div>
        </div>
    </main>

 
    <div class="widget-acessibilidade-nativo" role="group" aria-label="Controles manuais de acessibilidade">
        <button type="button" id="btn-aumentar" onclick="mudarFonte(1)" aria-label="Aumentar tamanho do texto">A+</button>
        <button type="button" id="btn-diminuir" onclick="mudarFonte(-1)" aria-label="Diminuir tamanho do texto">A-</button>
        <button type="button" id="btn-contraste" onclick="toggleContraste()" aria-label="Alternar alto contraste">
            <i class="fas fa-adjust" aria-hidden="true"></i>
        </button>
    </div>
       
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="assets/js/dados-lugares.js"></script>
<script src="assets/js/mapa.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>

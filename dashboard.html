<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>AccessMap - Painel do Administrador</title>

    <link rel="icon" type="image/png" href="assets/images/logo-roxa.png">
</head>

<body class="pagina-dashboard">
    <nav class="navbar navbar-admin" aria-label="Navegação do Painel Administrativo">
<a href="index.html" class="logo">
    <img src="assets/images/logo-branca.png" alt="Logotipo AccessMap com símbolo de localização" class="logo-img">
    <span class="logo-text">ACCESSMAP</span>
    <span class="badge-admin">ADMIN</span>
</a>

        <div class="nav-right">
            <span class="admin-user">
                <i class="fas fa-user-shield" aria-hidden="true"></i>
                Administrador
            </span>
            <a href="index.html" class="btn-logout">
                <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
                Sair
            </a>
        </div>
    </nav>

    <main id="conteudo-dashboard" class="dashboard-layout">

        <aside class="dashboard-sidebar" aria-label="Filtrar respostas do formulário">
            <h2 class="sidebar-title">Filtrar Respostas</h2>

            <div class="filtro-grupo">
                <label for="filtro-local">Local da Ocorrência</label>
                <div class="input-wrapper">
                    <i class="fas fa-map-pin" aria-hidden="true"></i>
                    <input type="text" id="filtro-local" placeholder="Ex: Bloco A, Biblioteca...">
                </div>
            </div>

            <fieldset class="filtro-grupo fieldset-reset">
                <legend class="label-style">Categoria de Acessibilidade</legend>
                <div class="type-buttons" role="group" aria-label="Filtrar por categoria de acessibilidade">
                    <button type="button" class="btn-type btn-fisica filtro-categoria" data-categoria="fisica" aria-pressed="false">FÍSICA</button>
                    <button type="button" class="btn-type btn-auditiva filtro-categoria" data-categoria="auditiva" aria-pressed="false">AUDITIVA</button>
                </div>
            </fieldset>

            <div class="filtro-grupo">
                <label for="filtro-relato">Palavra-chave no relato</label>
                <div class="input-wrapper">
                    <i class="fas fa-comment-dots" aria-hidden="true"></i>
                    <input type="text" id="filtro-relato" placeholder="Buscar no texto do relato...">
                </div>
            </div>

            <div class="filtro-grupo">
                <label for="filtro-ordenacao">Ordenar por</label>
                <div class="input-wrapper select-wrapper">
                    <i class="fas fa-arrow-down-wide-short" aria-hidden="true"></i>
                    <select id="filtro-ordenacao">
                        <option value="recentes">Mais recentes</option>
                        <option value="antigos">Mais antigos</option>
                        <option value="local">Local (A-Z)</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn-limpar-filtros" id="btn-limpar-filtros">
                <i class="fas fa-filter-circle-xmark" aria-hidden="true"></i>
                Limpar Filtros
            </button>

            <div class="sidebar-divider" role="separator"></div>

            <a href="admin.html" class="btn-editar-mapa">
                <i class="fas fa-map-location-dot" aria-hidden="true"></i>
                Ir para Edição do Mapa
            </a>
        </aside>

        <section class="dashboard-central" aria-label="Respostas coletadas pelo formulário">
            <header class="dashboard-header">
                <div class="dashboard-header-titulo">
                    <h1>Respostas Coletadas</h1>
                    <p>Relatos enviados pelo formulário de colaboração da página principal.</p>
                </div>
                <span class="contador-respostas" id="contador-respostas">0 respostas</span>
            </header>

            <div class="respostas-lista" id="respostas-lista">
                <p class="respostas-vazio" id="respostas-vazio" hidden>
                    Nenhuma resposta encontrada para os filtros selecionados.
                </p>
            </div>
        </section>

    </main>

    <div class="widget-acessibilidade-nativo" role="group" aria-label="Controles manuais de acessibilidade">
        <button type="button" id="btn-aumentar" onclick="mudarFonte(1)" aria-label="Aumentar tamanho do texto">A+</button>
        <button type="button" id="btn-diminuir" onclick="mudarFonte(-1)" aria-label="Diminuir tamanho do texto">A-</button>
        <button type="button" id="btn-contraste" onclick="toggleContraste()" aria-label="Alternar alto contraste">
            <i class="fas fa-adjust" aria-hidden="true"></i>
        </button>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="assets/js/dashboard.js"></script>
</body>

</html>

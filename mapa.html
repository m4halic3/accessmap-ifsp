<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#44025c">
    <title>Mapa do Campus - AccessMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/images/logo-roxa.png">
</head>
<body>
    <a href="#search-input" class="skip-link">Pular para a busca de locais</a>

    <nav class="navbar" aria-label="Navegação principal">
        <a href="index.html" class="logo" style="text-decoration:none;">
            <img src="assets/images/logo-branca.png" alt="" class="logo-img">
            <span class="logo-text">ACCESSMAP</span>
            <span class="sr-only">— voltar à página inicial</span>
        </a>
        <div class="nav-right">
            <a href="index.html#contato" class="btn-login-destaque">
                <i class="fas fa-comment-dots" aria-hidden="true"></i> <span class="nav-texto">Relatar um problema</span>
            </a>
        </div>
    </nav>

    <main class="container-mapa" id="container-mapa-conteudo">
        <div class="sidebar" id="painel-sidebar-conteudo">
            <button type="button" id="btn-alca-sidebar" class="sidebar-alca" aria-expanded="false" aria-controls="painel-sidebar-conteudo">
                <span class="alca-barra" aria-hidden="true"></span>
                <span class="alca-texto">Ver locais e filtros</span>
            </button>
            <h1 class="sr-only">Mapa de acessibilidade do campus</h1>
            <h2 id="titulo-resultados">Resultados (Mapa Geral)</h2>
            <p id="contador-resultados" class="contador-resultados" aria-live="polite"></p>

            <div class="search-container">
                <label for="search-input" class="sr-only">Pesquisar local no campus</label>
                <i class="fas fa-search search-icon" aria-hidden="true"></i>
                <input type="search" id="search-input" placeholder="Buscar local (ex.: biblioteca)" autocomplete="off" enterkeyhint="search" onkeydown="handleBuscaKeydown(event)">
            </div>

            <div class="fieldset-reset" role="group" aria-labelledby="titulo-filtro-ala">
                <span id="titulo-filtro-ala">Mapa exibido</span>
                <div class="type-buttons" id="seletor-alas">
                    <button type="button" class="btn-type active" data-ala="todos" aria-pressed="true" onclick="filtrarAla('todos')">Mapa Geral</button>
                    <button type="button" class="btn-type" data-ala="edificacoes" aria-pressed="false" onclick="filtrarAla('edificacoes')">Subsolo Edif.</button>
                    <button type="button" class="btn-type" data-ala="mecanica" aria-pressed="false" onclick="filtrarAla('mecanica')">Subsolo Mec.</button>
                </div>

                <button type="button" class="btn-limpar-mapa" onclick="resetarMapaCompleto()">
                    <i class="fas fa-eraser" aria-hidden="true"></i> Limpar mapa e filtros
                </button>
            </div>

            <div class="header-filtros">
                <h3 id="titulo-filtro-acess">Filtrar por acessibilidade</h3>
                <button type="button" id="btn-ver-todos" class="btn-reset" aria-pressed="false" onclick="mostrarTodos()">Ver todos</button>
            </div>

            <div class="filtros" role="group" aria-labelledby="titulo-filtro-acess">
                <button type="button" class="filtro" data-filtro="fisica" aria-pressed="false" onclick="filtrar('fisica')" title="Acessibilidade física">
                    <img src="assets/images/simbolo-fisica.png" alt="Acessibilidade física">
                </button>
                <button type="button" class="filtro" data-filtro="auditiva" aria-pressed="false" onclick="filtrar('auditiva')" title="Acessibilidade auditiva">
                    <img src="assets/images/simbolo-auditiva.png" alt="Acessibilidade auditiva">
                </button>
            </div>

            <details class="legenda-mapa">
                <summary>Legenda dos ícones</summary>
                <div id="legenda-conteudo"></div>
            </details>

            <div id="lista-lugares" role="region" aria-label="Lista de locais encontrados"></div>
        </div>

        <div id="map" role="region" aria-label="Mapa interativo do campus"></div>
    </main>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <div class="widget-acessibilidade-nativo" role="group" aria-label="Controles de acessibilidade">
        <button type="button" id="btn-aumentar" onclick="mudarFonte(1)" aria-label="Aumentar tamanho do texto">A+</button>
        <button type="button" id="btn-diminuir" onclick="mudarFonte(-1)" aria-label="Diminuir tamanho do texto">A-</button>
        <button type="button" id="btn-contraste" onclick="toggleContraste()" aria-label="Alto contraste" aria-pressed="false">
            <i class="fas fa-adjust" aria-hidden="true"></i>
        </button>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script src="assets/js/acessibilidade.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/plantas-storage.js"></script>
    <script src="assets/js/icones-lugares.js"></script>
    <script src="assets/js/mapa.js"></script>
    <script src="assets/js/sidebar-mapa.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Cadastro - AccessMap</title>
</head>
<body class="autenticacao">

<header class="auth-header">
    <a href="index.html" class="logo-link">
        <img src="assets/images/logo-roxa.png" alt="Logo AccessMap" class="logo-img-auth">
    </a>
    <a href="index.html" class="back-link">Voltar</a>
</header>

    <div class="auth-container">
        <div class="auth-card active">
            <h2>Cadastre-se</h2>

            <div class="input-group">
                <input type="text" placeholder="Nome completo" required>
            </div>

            <div class="input-group">
                <input type="email" placeholder="Endereço de Email" required>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <input type="password" placeholder="Senha" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Confirme sua senha" required>
                </div>
            </div>

            <button class="btn-auth">Criar conta</button>

            <p class="switch">Já tem uma conta? <a href="login.html">Log in</a></p>
        </div>
    </div>
    <!-- Widgets de Acessibilidade -->

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

<script 
    src="https://cdn.userway.org/widget.js" 
    data-account="YOUR_ACCOUNT_ID"
    data-position="5" 
    data-size="small">
</script>
    <script src="assets/js/script.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Login - AccessMap</title>
</head>
<body class="autenticacao">
    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html">
                <img src="assets/images/logo-roxa.png" alt="Logo AccessMap" class="logo-img-auth">
            </a>
            <a href="index.html" class="back-link">Voltar</a>
        </div>

        <div class="auth-card active">
            <h2>Log in</h2>
            <div class="input-group">
                <input type="text" placeholder="Nome de usuário">
            </div>
            <div class="input-group">
                <input type="password" placeholder="Senha">
            </div>
            <div class="options">
                <label><input type="checkbox"> Lembre-me</label>
                <a href="#">Esqueceu a senha?</a>
            </div>
            <button class="btn-auth">Log in</button>
            <p class="switch">ou <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </div>

    <!-- Widgets de Acessibilidade -->

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>


    <script src="assets/js/script.js"></script>
</body>
</html>

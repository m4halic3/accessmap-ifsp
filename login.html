<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Login - AccessMap</title>
</head>
<body class="autenticacao">
    
    <div class="auth-container">
        <header class="auth-header">
            <a href="index.html" aria-label="Voltar para a página inicial Home">
                <img src="assets/images/logo-roxa.png" alt="Logotipo AccessMap" class="logo-img-auth">
            </a>
            <a href="index.html" class="back-link">Voltar</a>
        </header>

        <main class="auth-card active" id="form-login">
            <h2>Log in</h2>
            
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="user-login" class="sr-only">Nome de usuário</label>
                    <input type="text" id="user-login" placeholder="Nome de usuário" required>
                </div>
                
                <div class="input-group">
                    <label for="pass-login" class="sr-only">Senha</label>
                    <input type="password" id="pass-login" placeholder="Senha" required>
                </div>
                
                <div class="options">
                    <label><input type="checkbox"> Lembre-me</label>
                    <a href="#">Esqueceu a senha?</a>
                </div>
                
                <button type="submit" class="btn-auth">Log in</button>
            </form>
            
            <p class="switch">ou <a href="cadastro.html">Cadastre-se</a></p>
        </main>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <div class="widget-acessibilidade-nativo" role="group" aria-label="Controles manuais de acessibilidade">
        <button type="button" id="btn-aumentar" onclick="mudarFonte(1)" aria-label="Aumentar tamanho do texto">A+</button>
        <button type="button" id="btn-diminuir" onclick="mudarFonte(-1)" aria-label="Diminuir tamanho do texto">A-</button>
        <button type="button" id="btn-contraste" onclick="toggleContraste()" aria-label="Alternar alto contraste">
            <i class="fas fa-adjust" aria-hidden="true"></i>
        </button>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="assets/js/script.js"></script>
</body>
</html>

spring.application.name=accessmap

# ---------- Banco de dados (MariaDB) ----------
# Os valores padrão batem com o docker-compose.yml da raiz do projeto.
spring.datasource.url=${ACCESSMAP_DB_URL:jdbc:mariadb://localhost:3306/accessmap}
spring.datasource.username=${ACCESSMAP_DB_USUARIO:accessmap}
spring.datasource.password=${ACCESSMAP_DB_SENHA:accessmap}

# O esquema é criado e versionado pelo Flyway (src/main/resources/db/migration);
# o Hibernate só confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---------- API ----------
server.port=${PORT:8080}
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Sao_Paulo
server.error.include-message=always

# Imagens de planta: até 25 MB (mesmo limite do front-end)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# ---------- AccessMap ----------
# Pasta do front-end (HTML, CSS, JS, imagens), servida em http://localhost:8080.
# Também é de lá que sai a lista original de locais (assets/data/locais-originais.json).
accessmap.frontend-dir=${ACCESSMAP_FRONTEND_DIR:..}

# Conta criada na primeira execução, se ainda não houver administrador no banco.
# Em produção, defina outras credenciais pelas variáveis de ambiente.
accessmap.admin.usuario=${ACCESSMAP_ADMIN_USUARIO:admin.teste}
accessmap.admin.senha=${ACCESSMAP_ADMIN_SENHA:Avaliacao@2025}

# Segredo (mín. 32 caracteres) para assinar os tokens de login. Vazio = gera um
# aleatório a cada inicialização (os administradores precisam entrar de novo).
accessmap.jwt.segredo=${ACCESSMAP_JWT_SEGREDO:}
accessmap.jwt.validade-horas=8

# Origens extras liberadas no CORS (ex.: front servido por outro servidor em
# desenvolvimento), separadas por vírgula.
accessmap.cors.origens=${ACCESSMAP_CORS_ORIGENS:http://localhost:8000,http://127.0.0.1:8000}

# Os arquivos estáticos são servidos só a partir de accessmap.frontend-dir (ver WebConfig)
spring.web.resources.add-mappings=false
